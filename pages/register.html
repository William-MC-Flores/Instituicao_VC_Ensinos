<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VC Ensinos | Cadastro</title>
  <link rel="shortcut icon" href="../img/logoPequenaBranca.png" type="image/x-icon">
  <link rel="stylesheet" href="../css/login_cadastro.css">
</head>
<body>
  <main class="login">
    <div class="container_login">
      <section class="caixa_conteudo_login" aria-label="VC Ensinos">
        <div class="caixa">
          <div class="header_caixa"><a href="../index.php">Voltar para a página <img src="../img/setaBranca.png" alt=""></a></div>
          <div class="conteudo_caixa"><img src="../img/logogGrandeBranca.png" alt="VC Ensinos"></div>
        </div>
      </section>
      <section class="login_form1">
        <div class="form_inputs">
          <div class="escrita_form"><h1>Crie sua conta</h1><p>Cadastre-se para explorar a VC Ensinos.</p></div>
          <form id="register-form">
            <div class="linha"></div>
            <div class="register-fields">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="name" autocomplete="name" maxlength="120" required>
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" autocomplete="email" required>
              <label for="password">Senha (mínimo de 8 caracteres)</label>
              <input type="password" id="password" name="new-password" autocomplete="new-password" minlength="8" required>
              <button type="submit">Cadastrar</button>
            </div>
          </form>
          <div id="error-message" class="message error" role="alert" aria-live="polite"></div>
          <div id="success-message" class="message success" role="status" aria-live="polite"></div>
          <div class="escrita_form"><p>Já tem uma conta? <a href="login.html">Faça login</a></p></div>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="../js/cadastro/register.js"></script>
</body>
</html>

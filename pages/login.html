<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VC Ensinos | Login</title>
  <link rel="stylesheet" href="../css/login_cadastro.css">
  <link rel="shortcut icon" href="../img/logoPequenaBranca.png" type="image/x-icon">
</head>
<body>
  <main class="login">
    <div class="container_login">
      <section class="caixa_conteudo_login" aria-label="VC Ensinos">
        <div class="caixa">
          <div class="header_caixa"><a href="../index.php">Voltar para a página <img src="../img/setaBranca.png" alt=""></a></div>
          <div class="conteudo_caixa"><img src="../img/logogGrandeBranca.png" alt="VC Ensinos"></div>
        </div>
      </section>
      <section class="login_form1">
        <div class="form_inputs">
          <div class="escrita_form">
            <h1>Faça seu login</h1>
            <p>Não tem uma conta? <a href="register.html">Cadastre-se</a></p>
          </div>
          <div class="linha"></div>
          <form id="login-form">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="submit">Entrar</button>
          </form>
          <div id="error-message" class="message error" role="alert" aria-live="polite"></div>
          <div id="success-message" class="message success" role="status" aria-live="polite"></div>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="../js/cadastro/app.js"></script>
</body>
</html>
